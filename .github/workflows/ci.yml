name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installed suite: the repo's explicit clean-tree gate
      # (run-tests.py --installed, allowlist + asserted counts).
      # The full source suite (294 tests) is the release-tree gate and
      # requires release artifacts (wheelhouse, MANIFEST, mcp SDK) that
      # only exist in release validation — not a clean checkout.
      - name: Installed suite
        run: python3 -B python-control-plane/run-tests.py --installed
      # Mirror parity + package integrity: quick-validate.py compares the
      # VISIBLE_PROJECT_TEMPLATE mirror against project/.claude (file list +
      # digests) and PACKAGE_CONTENTS.txt against the generator-eligible tree.
      # Without this gate a PR can edit the hidden payload, pass the test
      # suites, and land mirror/index drift on main.
      - name: Package and mirror integrity
        run: python3 scripts/quick-validate.py
      - name: Plugin parity
        env:
          PYTHONPATH: python-control-plane/src:python-control-plane/tests
        run: python3 -m unittest test_plugin_parity
