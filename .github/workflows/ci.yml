name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source suite
        env:
          PYTHONPATH: python-control-plane/src:python-control-plane/tests
        run: python3 -m unittest discover -s python-control-plane/tests
      - name: Installed suite
        run: python3 -B python-control-plane/run-tests.py --installed
      - name: Plugin parity
        env:
          PYTHONPATH: python-control-plane/src:python-control-plane/tests
        run: python3 -m unittest test_plugin_parity
